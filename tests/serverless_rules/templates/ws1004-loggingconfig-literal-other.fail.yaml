---
AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"

Resources:
  Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Runtime: python3.12
      Handler: main.handler
      Tracing: Active
      LoggingConfig:
        # No log group in the template has this name
        LogGroup: other-logs

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: custom-logs
      RetentionInDays: 7
